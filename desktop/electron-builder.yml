appId: dev.autopsia.desktop
productName: Autopsia
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/typescript/**
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: build/icon.icns
  # Firma ad-hoc ("-"): sin certificado de Apple Developer, pero sella todo el
  # bundle. Con `null` la firma queda rota y macOS muestra "la app está dañada".
  identity: "-"
  hardenedRuntime: false
  extendInfo:
    CFBundleDocumentTypes:
      - CFBundleTypeName: Folder
        CFBundleTypeRole: Viewer
        LSItemContentTypes: [public.folder]
dmg:
  title: Autopsia
